version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: houseprice-ai-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./houseprice_ai.db
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./backend/app/ml/artifacts:/app/backend/app/ml/artifacts
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: houseprice-ai-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: houseprice-ai-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: houseprice-ai-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=houseprice
      - POSTGRES_PASSWORD=houseprice_secure_pass
      - POSTGRES_DB=houseprice_ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    profiles:
      - with-postgres
    restart: unless-stopped

volumes:
  pgdata:
